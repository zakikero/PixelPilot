[project]
name = "pipecat-quickstart"
version = "0.1.0"
description = "PixelPilot voice assistant with WebRTC and local audio"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3,<1",
    "pipecat-ai[kokoro,local,openai,rnnoise,runner,silero,webrtc,whisper]==1.12.0",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0.2",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
